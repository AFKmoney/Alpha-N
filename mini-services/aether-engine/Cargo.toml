[package]
name = "aether-engine"
version = "3.0.0"
edition = "2021"
authors = ["AFKmoney"]
license = "MIT"
description = "OpenAI-compatible semantic-memory LLM proxy with a 10-stage cognitive pipeline"
homepage = "https://github.com/AFKmoney/aether-engine"
repository = "https://github.com/AFKmoney/aether-engine"
keywords = ["llm", "semantic-memory", "openai", "axum", "rag"]
categories = ["web-programming::http-server", "api-bindings"]
readme = "README.md"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }

[profile.release]
opt-level = 3
lto = true
